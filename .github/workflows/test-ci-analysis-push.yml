#building and testing angular14
name: Test CI - quality - push 

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  name: build and test angular
  build-angular:

    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    strategy:
      matrix:
        node-version: [14.21.x]
        #  See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: front/package-lock.json
    
    #installation des dépendances
    - run: npm ci
    #build de la solution
    - run: npm run build --if-present
    #lancer les tests prédéfinis
    - run: npm run test-ci
  
  name: build and test java
  build-java:

    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back
        
    steps:
    - name: checkout code
      uses: actions/checkout@v4
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: mvn -B package --file pom.xml
  
  name: sonaQube analysis
  Analysis:
    runs-on: ubuntu-latest
    
    needs: [build-angular, build-java]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with: # Important pour que Sonar puisse analyser l'historique de Git
          fetch-depth: 0 
      - name: Analyze with SonarQube
        # You can pin the exact commit or the version.
        # uses: SonarSource/sonarqube-scan-action@v1.1.0
        uses: SonarSource/sonarqube-scan-action@v3
        env:
          #  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}   # Generate a token on SonarQube, add it to the secrets of this repo with the name SONAR_TOKEN (Settings > Secrets > Actions > add new repository secret)
          #  SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}   # add the URL of your instance to the secrets of this repo with the name SONAR_HOST_URL (Settings > Secrets > Actions > add new repository secret)
        with:
          # Additional arguments for the sonarcloud scanner
          args:
            # Unique key of your project. You can find it in SonarQube > [my project] > Project Information (top-right menu)
            # mandatory
            -Dsonar.projectKey=franck-g75_ocr-p10-ci-cd
            # Comma-separated paths to directories containing main source files.
            #-Dsonar.sources= # optional, default is project base directory
            # When you need the analysis to take place in a directory other than the one from which it was launched
            #-Dsonar.projectBaseDir= # optional, default is .
            # Comma-separated paths to directories containing test source files.
            #-Dsonar.tests= # optional. For more info about Code Coverage, please refer to https://docs.sonarcloud.io/enriching/test-coverage/overview/
            # Adds more detail to both client and server-side analysis logs, activating DEBUG mode for the scanner, and adding client-side environment variables and system properties to the server-side log of analysis report processing.
            #-Dsonar.verbose= # optional, default is false
  
  name: build and push to dockerHub
  build-and-push:
    runs-on: ubuntu-latest

    needs: Analysis

    strategy:
      matrix:
        node-version: [14.21.x]
        
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Étape 1 : Connexion à Docker Hub en utilisant mes secrets GitHub
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Étape 2 : Configuration de Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # ----------------------------------------------------
      # SECTION FRONTEND (Angular)
      # ----------------------------------------------------
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: front/package-lock.json

      - name: Build and push Frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./front
          file: ./front/Dockerfile
          push: true
          
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/franck-g75_ocr-p10-ci-cd_front:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ----------------------------------------------------
      # SECTION BACKEND (Java / Spring Boot)
      # ----------------------------------------------------
      - name: Build and push Backend image
        uses: docker/build-push-action@v7
        with:
          context: ./back
          file: ./back/Dockerfile
          push: true
          
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/franck-g75_ocr-p10-ci-cd_back:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          