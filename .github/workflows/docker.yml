name: Build and Push to Docker Hub

on:
  push:
    branches: [ "main" ]

jobs:

  build-and-push:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [14.21.x]
        
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Étape 1 : Connexion à Docker Hub en utilisant mes secrets GitHub
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Étape 2 : Configuration de Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ----------------------------------------------------
      # SECTION FRONTEND (Angular)
      # ----------------------------------------------------
      # You'll need to make sure node is installed first
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: front/package-lock.json

      - name: Install yarn
        run: npm install -g yarn
  
      - name: Build and push Frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./front
          file: ./front/Dockerfile
          push: true
          
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/franck-g75_ocr-p10-ci-cd_front:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ----------------------------------------------------
      # SECTION BACKEND (Java / Spring Boot)
      # ----------------------------------------------------
      - name: Build and push Backend image
        uses: docker/build-push-action@v7
        with:
          context: ./back
          file: ./back/Dockerfile
          push: true
          
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/franck-g75_ocr-p10-ci-cd_back:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          
