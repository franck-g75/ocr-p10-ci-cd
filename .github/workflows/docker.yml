name: Build and Push to Docker Hub

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Étape 1 : Connexion à Docker Hub en utilisant mes secrets GitHub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Étape 2 : Configuration de Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ----------------------------------------------------
      # SECTION FRONTEND (Angular)
      # ----------------------------------------------------
      - name: Build and push Frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./front
          file: ./front/Dockerfile
          push: true
          
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/franck-g75_ocr-p10-ci-cd_front:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ----------------------------------------------------
      # SECTION BACKEND (Java / Spring Boot)
      # ----------------------------------------------------
      - name: Build and push Backend image
        uses: docker/build-push-action@v6
        with:
          context: ./back
          file: ./back/Dockerfile
          push: true
          
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/franck-g75_ocr-p10-ci-cd_back:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          
